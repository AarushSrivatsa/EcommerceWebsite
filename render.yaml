services:
  - type: web
    name: script-to-video
    runtime: docker
    plan: starter                  # 512 MB: the app is built to fit (peak about 450 MB while rendering). Free also has 512 MB but sleeps when idle and kills running jobs
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false                # secrets: Render asks for these when you create the service
      - key: DATABASE_URL          # postgresql+psycopg://... (the Supabase session pooler string)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
