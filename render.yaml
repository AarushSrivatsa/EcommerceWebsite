services:
  - type: web
    name: script-to-video
    runtime: docker
    plan: starter                  # 512 MB target; check container_memory logs and Render service metrics under real workloads
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false                # secrets: Render asks for these when you create the service
      - key: DATABASE_URL          # postgresql+psycopg://... (the Supabase session pooler string)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CREDENTIALS_SECRET    # any long random string; encrypts the stored YouTube credentials
        sync: false
