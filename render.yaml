services:
  - type: web
    name: script-to-video
    runtime: docker
    plan: standard                 # 2 GB RAM: the voice model and the embedder do not fit the 512 MB plans
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true        # Render makes a random key. Read it in the dashboard and send it as the X-API-Key header.
      - key: GROQ_API_KEY
        sync: false                # secrets: Render asks for these when you create the service
      - key: DATABASE_URL          # postgresql+psycopg://... (the Supabase session pooler string)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
